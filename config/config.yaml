# RAG System Configuration
#
# 本文件采用“本地优先（local-first）”配置：
# - 默认使用本地 Qdrant 存储目录，不连接远程服务器
# - 数据不应默认离开本地环境
# - 如需远程 Qdrant，必须显式修改 host/port；当前版本不建议启用

# Document Processing
document_processing:
  chunk_size: 512
  chunk_overlap: 50
  supported_formats: ['txt', 'pdf', 'docx', 'md']

# Encryption
encryption:
  algorithm: 'AES'
  key_size: 256  # bits
  mode: 'GCM'

# Embedding
embedding:
  model_name: 'sentence-transformers/all-MiniLM-L6-v2'  # Lightweight model
  dimension: 384
  batch_size: 32
  alternative_models:
    - 'sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2'
    - 'sentence-transformers/all-MiniLM-L12-v2'

# Vector Database (Qdrant)
vector_db:
  # 说明：本项目默认采用本地 Qdrant 存储，避免数据上传远程服务器。
  # 因此不配置 host/port，VectorStore 会直接使用 storage_path。
  collection_name: 'encrypted_documents'
  distance_metric: 'Cosine'
  storage_path: './qdrant_storage'
  # 可选：为避免 Windows 下本地 Qdrant 文件锁（.lock）导致的“AlreadyLocked”，
  # 你可以在某些脚本中启用“每次运行使用独立存储目录”的策略（会创建新目录）。
  # - null/不设置：使用 storage_path（默认）
  # - 'qdrant_storage_runs'：在该目录下为每次运行创建独立子目录
  per_run_storage_root: null

# Retrieval
retrieval:
  top_k_values: [3, 5, 10, 15]  # Different K values to test
  default_top_k: 15

# Local Rerank (two-stage retrieval)
rerank:
  enabled: true
  max_candidates: 20
  min_score: 0.0

# LLM (Ollama)
llm:
  # Baseline model for ablation/comparison (keep installed, do NOT delete).
  model_name: 'llama2'
  # Default model used by the main RAG chain (auto-selected after comparison).
  default_model: 'mistral'
  base_url: 'http://localhost:11434'
  quantization:
    enabled: true
    bits: 4
    type: 'nf4'  # or 'fp4'
  temperature: 0.7
  max_tokens: 512
  context_window: 2048

# RAG Pipeline
rag:
  # Strict prompt shared by all models for fair comparison.
  prompt_template: |
    You MUST answer ONLY based on the provided context.

    Precision-first rules (follow strictly):
    - Do NOT guess or infer missing details.
    - Do NOT provide partially correct answers.
    - If you cannot find direct evidence in the context for EVERY required part of the question, answer exactly: "I don't know".
    - For comparison/temporal questions (before/after/earlier/later/more than N days), only answer if the necessary dates/times are explicitly present in the context.
    - For multi-condition questions, verify each condition is supported; if any condition is unsupported, answer "I don't know".

    Output format:
    - Return ONE line only, starting with "Answer:".
    - Do not add explanations.

    Context:
    {context}

    Question:
    {question}
  max_context_length: 2000

# Audit Logging
audit:
  enabled: true
  log_directory: './logs'
  log_level: 'INFO'
  integrity_check: true
  log_rotation: 'daily'
  max_log_size: 10485760  # 10MB

# Evaluation
evaluation:
  test_dataset_size: 100
  metrics: ['f1', 'precision', 'recall', 'accuracy']
  benchmark_runs: 3

# Performance
performance:
  enable_caching: true
  max_workers: 4
