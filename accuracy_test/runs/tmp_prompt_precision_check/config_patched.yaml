document_processing:
  chunk_size: 512
  chunk_overlap: 50
  supported_formats:
  - txt
  - pdf
  - docx
  - md
encryption:
  algorithm: AES
  key_size: 256
  mode: GCM
embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  batch_size: 32
  alternative_models:
  - sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  - sentence-transformers/all-MiniLM-L12-v2
vector_db:
  collection_name: encrypted_documents
  distance_metric: Cosine
  storage_path: accuracy_test\runs\tmp_prompt_precision_check\qdrant_storage_copy
  per_run_storage_root: null
retrieval:
  top_k_values:
  - 3
  - 5
  - 10
  - 15
  default_top_k: 15
rerank:
  enabled: true
  max_candidates: 20
  min_score: 0.0
llm:
  model_name: llama2
  default_model: mistral
  base_url: http://localhost:11434
  quantization:
    enabled: true
    bits: 4
    type: nf4
  temperature: 0.7
  max_tokens: 512
  context_window: 2048
rag:
  prompt_template: 'You MUST answer ONLY based on the provided context.


    Precision-first rules (follow strictly):

    - Do NOT guess or infer missing details.

    - Do NOT provide partially correct answers.

    - If you cannot find direct evidence in the context for EVERY required part of
    the question, answer exactly: "I don''t know".

    - For comparison/temporal questions (before/after/earlier/later/more than N days),
    only answer if the necessary dates/times are explicitly present in the context.

    - For multi-condition questions, verify each condition is supported; if any condition
    is unsupported, answer "I don''t know".


    Output format:

    - Return ONE line only, starting with "Answer:".

    - Do not add explanations.


    Context:

    {context}


    Question:

    {question}

    '
  max_context_length: 2000
audit:
  enabled: true
  log_directory: ./logs
  log_level: INFO
  integrity_check: true
  log_rotation: daily
  max_log_size: 10485760
evaluation:
  test_dataset_size: 100
  metrics:
  - f1
  - precision
  - recall
  - accuracy
  benchmark_runs: 3
performance:
  enable_caching: true
  max_workers: 4
